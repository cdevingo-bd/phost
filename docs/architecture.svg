<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 912" width="1300" height="912" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How phost works and where the other packages fit</title>
<desc id="dsc">Implementations written in phost-author, phost-coupledchol or your own code are registered in phost against a stage contract. A session guards and installs them on a host adapter, which hooks the host's step (MuJoCo Warp). phost-lab runs graphs in isolated workers, phost-score judges and ranks results, and phost-dash puts it all in a browser.</desc>
<style>
  :root { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --line:#c3c2b7; --box:#ffffff; --core:#f6f6f3;
          --host:#2a78d6; --hostfill:#e6effb; --hook:#eb6834; --hookfill:#fdece4; --arrow:#52514e; --chip:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --line:#383835; --box:#232321; --core:#20201f;
            --host:#3987e5; --hostfill:#16273d; --hook:#d95926; --hookfill:#3a2218; --arrow:#c3c2b7; --chip:#1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .title { font-size: 28px; font-weight: 700; }
  .subtitle { font-size: 14.5px; fill: var(--ink2); }
  .col { font-size: 11px; letter-spacing: .09em; font-weight: 600; fill: var(--muted); }
  .h { font-size: 14.5px; font-weight: 650; }
  .t { font-size: 12px; fill: var(--ink2); }
  .tb { font-size: 12px; fill: var(--ink); font-weight: 600; }
  .s { font-size: 11px; fill: var(--ink2); }
  .m { font-size: 11px; fill: var(--muted); }
  .pkg { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
  .core { fill: var(--core); stroke: var(--ink); stroke-width: 1.8; }
  .inner { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
  .host { fill: var(--hostfill); stroke: var(--host); stroke-width: 1.5; }
  .hook { fill: var(--hookfill); stroke: var(--hook); stroke-width: 1.5; }
  .strip { fill: none; stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 2 0; }
  .dashed { stroke-dasharray: 5 4; }
  .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; marker-end: url(#head); }
  .flow.dash { stroke-dasharray: 5 4; }
  .bus { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
  .chip { fill: var(--chip); stroke: var(--line); stroke-width: 1; }
  .hookline { fill: none; stroke: var(--hook); stroke-width: 1.5; marker-end: url(#hhead); }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--arrow)"/></marker><marker id="hhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--hook)"/></marker></defs>
<rect x="0" y="0" width="1300" height="912" rx="0" class="" style="fill:var(--bg)"/>
<text x="40" y="48" class="title" text-anchor="start" >phost</text>
<text x="40" y="74" class="subtitle" text-anchor="start" >Swap one stage of a simulator's step for your own implementation, safely, and measure what it did.</text>
<text x="30" y="112" class="col" text-anchor="start" >1 · WRITE AN IMPLEMENTATION</text>
<text x="330" y="112" class="col" text-anchor="start" >2 · THE CORE: CONTRACT, GUARD, INSTALL</text>
<text x="850" y="112" class="col" text-anchor="start" >3 · RUN IT, JUDGE IT, LOOK AT IT</text>
<rect x="30" y="140" width="270" height="132" rx="10" class="pkg" />
<text x="44" y="160" class="h" text-anchor="start" >phost-author</text>
<text x="44" y="181" class="t" text-anchor="start" >type an equation</text>
<text x="44" y="197" class="s" text-anchor="start" >→ float64 reference + generated Warp kernel</text>
<text x="44" y="213" class="t" text-anchor="start" >write a kernel</text>
<text x="44" y="229" class="s" text-anchor="start" >→ checked in a sandbox before it runs</text>
<rect x="30" y="292" width="270" height="96" rx="10" class="pkg" />
<text x="44" y="312" class="h" text-anchor="start" >phost-coupledchol</text>
<text x="44" y="333" class="t" text-anchor="start" >coupled-block Cholesky</text>
<text x="44" y="349" class="s" text-anchor="start" >factors only the coupled DOFs:</text>
<text x="44" y="365" class="s" text-anchor="start" >cost c³, not nv³</text>
<rect x="30" y="408" width="270" height="78" rx="10" class="pkg dashed" />
<text x="44" y="428" class="h" text-anchor="start" >Your code</text>
<text x="44" y="449" class="t" text-anchor="start" >any Impl written against a contract</text>
<text x="44" y="466" class="s" text-anchor="start" >(a plugin module with register(registry))</text>
<path d="M300,206 H316 V436 H300" class="bus"/>
<path d="M300,340 H316" class="bus"/>
<path d="M316,206 H346" class="flow"/>
<text x="308" y="198" class="s" text-anchor="start" ></text>
<rect x="330" y="140" width="450" height="446" rx="14" class="core" />
<text x="346" y="162" class="h" text-anchor="start" >phost</text>
<text x="396" y="162" class="m" text-anchor="start" >the core has no required dependencies</text>
<rect x="346" y="178" width="200" height="100" rx="10" class="inner" />
<text x="360" y="198" class="h" text-anchor="start" >Implementation</text>
<text x="360" y="218" class="t" text-anchor="start" >id · params · applicability</text>
<text x="360" y="233.5" class="t" text-anchor="start" >registered with the registry,</text>
<text x="360" y="249.0" class="t" text-anchor="start" >written against a contract,</text>
<text x="360" y="264.5" class="t" text-anchor="start" >never against a host</text>
<rect x="566" y="178" width="198" height="100" rx="10" class="inner" />
<text x="580" y="198" class="h" text-anchor="start" >Stage contract</text>
<text x="580" y="218" class="t" text-anchor="start" >ports · layouts · invariants</text>
<text x="580" y="233.5" class="t" text-anchor="start" >swap class · tolerances</text>
<text x="580" y="249.0" class="t" text-anchor="start" >metrics · float64 reference</text>
<path d="M546,228 H566" class="flow"/>
<rect x="346" y="296" width="418" height="52" rx="10" class="inner" />
<text x="360" y="316" class="h" text-anchor="start" >Registry</text>
<text x="360" y="336" class="t" text-anchor="start" >contracts and implementations, described as JSON</text>
<path d="M446,278 V296" class="flow"/>
<path d="M665,278 V296" class="flow"/>
<rect x="346" y="366" width="200" height="124" rx="10" class="inner" />
<text x="360" y="386" class="h" text-anchor="start" >Session</text>
<text x="360" y="407" class="t" text-anchor="start" >selection: stage → impl</text>
<text x="360" y="423" class="t" text-anchor="start" >guard: reviewed host source</text>
<text x="360" y="439" class="t" text-anchor="start" >scoped install, always undone</text>
<text x="360" y="455" class="t" text-anchor="start" >meters: calls, advisories</text>
<rect x="566" y="366" width="198" height="124" rx="10" class="inner" />
<text x="580" y="386" class="h" text-anchor="start" >Host adapter</text>
<text x="580" y="407" class="t" text-anchor="start" >MJWarpHost · MJLabHost</text>
<text x="580" y="423" class="t" text-anchor="start" >FakeHost (no simulator)</text>
<text x="580" y="439" class="t" text-anchor="start" >maps the host's functions</text>
<text x="580" y="455" class="t" text-anchor="start" >onto the stage contracts</text>
<path d="M446,348 V366" class="flow"/>
<path d="M546,428 H566" class="flow"/>
<rect x="346" y="506" width="418" height="56" rx="10" class="inner" />
<text x="360" y="526" class="h" text-anchor="start" >check_impl  (phost.testing)</text>
<text x="360" y="545" class="s" text-anchor="start" >judges an impl against its float64 reference, within the contract's tolerances</text>
<rect x="850" y="140" width="390" height="124" rx="10" class="pkg" />
<text x="864" y="160" class="h" text-anchor="start" >phost-dash</text>
<text x="864" y="181" class="t" text-anchor="start" >in your browser, on your machine</text>
<text x="864" y="197" class="s" text-anchor="start" >build a graph · watch it live · time it</text>
<text x="864" y="213" class="s" text-anchor="start" >record it · leaderboard · replay</text>
<text x="864" y="229" class="s" text-anchor="start" >runs no GPU work itself: workers do</text>
<rect x="850" y="296" width="390" height="138" rx="10" class="pkg" />
<text x="864" y="316" class="h" text-anchor="start" >phost-lab</text>
<text x="864" y="337" class="t" text-anchor="start" >a graph (JSON): which impl on which stage</text>
<text x="864" y="353" class="s" text-anchor="start" >→ an isolated worker process, killed on cancel</text>
<text x="864" y="369" class="s" text-anchor="start" >→ timed run against native and a native control</text>
<text x="864" y="385" class="s" text-anchor="start" >→ live pass: native and graph side by side</text>
<rect x="850" y="468" width="390" height="118" rx="10" class="pkg" />
<text x="864" y="488" class="h" text-anchor="start" >phost-score</text>
<text x="864" y="509" class="t" text-anchor="start" >gates chosen by the swap class</text>
<text x="864" y="525" class="s" text-anchor="start" >→ hash-chained ledger → Pareto leaderboard</text>
<text x="864" y="541" class="s" text-anchor="start" >reverify: run it again here, compare</text>
<path d="M900,264 V296" class="flow"/>
<rect x="938.65" y="271" width="92.7" height="20" rx="10" class="chip" />
<text x="985" y="285" class="m" text-anchor="middle" >graph + scene</text>
<path d="M1190,296 V264" class="flow"/>
<rect x="1045.0" y="271" width="146" height="20" rx="10" class="chip" />
<text x="1118" y="285" class="m" text-anchor="middle" >progress · frames · result</text>
<path d="M900,434 V468" class="flow"/>
<rect x="926.55" y="441" width="80.9" height="20" rx="10" class="chip" />
<text x="967" y="455" class="m" text-anchor="middle" >result JSON</text>
<path d="M1240,527 H1262 V202 H1240" class="flow"/>
<text transform="translate(1281,364) rotate(-90)" class="m" text-anchor="middle">ledger and board</text>
<path d="M850,365 H780" class="flow"/>
<text x="815" y="343" class="m" text-anchor="middle" >builds a</text>
<text x="815" y="356" class="m" text-anchor="middle" >Session</text>
<path d="M1045,140 V124 H165 V140" class="flow dash"/>
<rect x="565.0" y="114" width="190" height="20" rx="10" class="chip" />
<text x="660" y="128" class="m" text-anchor="middle" >equation preview · kernel check</text>
<rect x="30" y="610" width="1230" height="262" rx="14" class="strip" />
<text x="48" y="636" class="h" text-anchor="start" >The host's step: MuJoCo Warp</text>
<text x="300" y="636" class="m" text-anchor="start" >mjw.step = forward(), then the integrator</text>
<rect x="640" y="626" width="12" height="12" rx="3" class="host" />
<text x="658" y="637" class="s" text-anchor="start" >the host's own code</text>
<rect x="800" y="626" width="12" height="12" rx="3" class="hook" />
<text x="818" y="637" class="s" text-anchor="start" >where an implementation slots in</text>
<path d="M665,562 V610" class="flow"/>
<text x="676" y="598" class="m" text-anchor="start" >installs the hooks on the host's functions</text>
<rect x="38" y="724" width="1032" height="88" rx="12" class="strip dashed" />
<text x="46" y="718" class="m" text-anchor="start" >forward()</text>
<rect x="48" y="740" width="152" height="56" rx="9" class="host" />
<text x="60" y="762" class="tb" text-anchor="start" >fwd_position</text>
<text x="60" y="780" class="s" text-anchor="start" >kinematics, constraints</text>
<rect x="220" y="740" width="152" height="56" rx="9" class="host" />
<text x="232" y="762" class="tb" text-anchor="start" >fwd_velocity</text>
<text x="232" y="780" class="s" text-anchor="start" >calls passive.passive</text>
<rect x="392" y="740" width="152" height="56" rx="9" class="host" />
<text x="404" y="762" class="tb" text-anchor="start" >fwd_actuation</text>
<text x="404" y="780" class="s" text-anchor="start" >ctrl → actuator force</text>
<rect x="564" y="740" width="152" height="56" rx="9" class="host" />
<text x="576" y="762" class="tb" text-anchor="start" >fwd_acceleration</text>
<text x="576" y="780" class="s" text-anchor="start" >qacc_smooth = M⁻¹ f</text>
<rect x="736" y="740" width="152" height="56" rx="9" class="host" />
<text x="748" y="762" class="tb" text-anchor="start" >solver.solve</text>
<text x="748" y="780" class="s" text-anchor="start" >Newton iterations</text>
<rect x="908" y="740" width="152" height="56" rx="9" class="host" />
<text x="920" y="762" class="tb" text-anchor="start" >forward() ends</text>
<text x="920" y="780" class="s" text-anchor="start" >sensors, post-constraint</text>
<rect x="1080" y="740" width="152" height="56" rx="9" class="host" />
<text x="1092" y="762" class="tb" text-anchor="start" >integrator</text>
<text x="1092" y="780" class="s" text-anchor="start" >euler · rk4 · implicit</text>
<path d="M200,768.0 H220" class="flow"/>
<path d="M372,768.0 H392" class="flow"/>
<path d="M544,768.0 H564" class="flow"/>
<path d="M716,768.0 H736" class="flow"/>
<path d="M888,768.0 H908" class="flow"/>
<path d="M1060,768.0 H1080" class="flow"/>
<rect x="383.0" y="656" width="170" height="46" rx="9" class="hook" />
<text x="393.0" y="675" class="tb" text-anchor="start" >control.law</text>
<text x="393.0" y="692" class="s" text-anchor="start" >before · changes the physics</text>
<path d="M468,702 V739" class="hookline"/>
<rect x="1020.0" y="656" width="200" height="46" rx="9" class="hook dashed" />
<text x="1030.0" y="675" class="tb" text-anchor="start" >dof.passive_force</text>
<text x="1030.0" y="692" class="s" text-anchor="start" >also on Euler's implicit damping</text>
<path d="M1120,702 V739" class="hookline"/>
<rect x="211.0" y="812" width="170" height="46" rx="9" class="hook" />
<text x="221.0" y="831" class="tb" text-anchor="start" >dof.passive_force</text>
<text x="221.0" y="848" class="s" text-anchor="start" >after · changes the physics</text>
<path d="M296,812 V797" class="hookline" style="marker-end:none;marker-start:url(#hhead)"/>
<rect x="727.0" y="812" width="170" height="46" rx="9" class="hook" />
<text x="737.0" y="831" class="tb" text-anchor="start" >newton.linear_solve</text>
<text x="737.0" y="848" class="s" text-anchor="start" >replaces the solve · exact</text>
<path d="M812,812 V797" class="hookline" style="marker-end:none;marker-start:url(#hhead)"/>
<rect x="909.0" y="812" width="170" height="46" rx="9" class="hook" />
<text x="919.0" y="831" class="tb" text-anchor="start" >probe.state</text>
<text x="919.0" y="848" class="s" text-anchor="start" >after · read-only</text>
<path d="M994,812 V797" class="hookline" style="marker-end:none;marker-start:url(#hhead)"/>
<text x="48" y="896" class="m" text-anchor="start" >Package boxes are separate repositories. Everything here is MIT licensed. Only one host build is reviewed (MuJoCo Warp 3.17.0); any other is refused.</text>
</svg>