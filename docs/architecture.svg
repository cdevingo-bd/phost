</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--ink2)"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--accent)"/></marker></defs>
<rect x="0" y="0" width="1000" height="790" style="fill:var(--bg)"/>
<text x="24" y="28" class="title" text-anchor="start">phost: stage contracts between a simulator and what replaces its parts</text>
<text x="976" y="28" class="tag mono" text-anchor="end">the core imports only the standard library</text>
<text x="24" y="62" class="head" text-anchor="start">implementations</text>
<text x="24" y="78" class="small" text-anchor="start">written against the contract, never a host</text>
<text x="356" y="62" class="head acc" text-anchor="start">stage contract</text>
<text x="356" y="78" class="small" text-anchor="start">what any implementation and any host agree on</text>
<text x="704" y="62" class="head" text-anchor="start">hosts</text>
<text x="704" y="78" class="small" text-anchor="start">an adapter maps the simulator's own function</text>
<text x="704" y="92" class="small" text-anchor="start">onto the contract</text>
<rect x="24" y="100.0" width="272" height="72.0" rx="3" class="box"/>
<text x="33" y="118.0" class="head" text-anchor="start">typed equation</text>
<text x="33" y="135.0" class="small" text-anchor="start">a few lines of text, compiled</text>
<text x="33" y="149.0" class="small" text-anchor="start">NumPy, Warp or JAX backend</text>
<text x="288" y="164.0" class="tag mono" text-anchor="end">phost-author</text>
<rect x="24" y="184.0" width="272" height="72.0" rx="3" class="box"/>
<text x="33" y="202.0" class="head" text-anchor="start">sandboxed kernel</text>
<text x="33" y="219.0" class="small" text-anchor="start">your Python class, checked in</text>
<text x="33" y="233.0" class="small" text-anchor="start">a sandbox before it runs</text>
<text x="288" y="248.0" class="tag mono" text-anchor="end">phost-author</text>
<rect x="24" y="268.0" width="272" height="72.0" rx="3" class="box"/>
<text x="33" y="286.0" class="head" text-anchor="start">coupled-block Cholesky</text>
<text x="33" y="303.0" class="small" text-anchor="start">a Warp solver, bound to two</text>
<text x="33" y="317.0" class="small" text-anchor="start">solve stages</text>
<text x="288" y="332.0" class="tag mono" text-anchor="end">phost-coupledchol</text>
<rect x="24" y="352.0" width="272" height="72.0" rx="3" class="box"/>
<text x="33" y="370.0" class="head" text-anchor="start">built-in laws</text>
<text x="33" y="387.0" class="small" text-anchor="start">spring, damper, PD, probe:</text>
<text x="33" y="401.0" class="small" text-anchor="start">NumPy and Warp versions</text>
<text x="288" y="416.0" class="tag mono" text-anchor="end">phost</text>
<rect x="24" y="436.0" width="272" height="72.0" rx="3" class="yours"/>
<text x="33" y="454.0" class="head" text-anchor="start">yours</text>
<text x="33" y="471.0" class="small" text-anchor="start">a class with the stage's entry</text>
<text x="33" y="485.0" class="small" text-anchor="start">method, checked like the rest</text>
<rect x="356" y="100" width="288" height="408" rx="3" class="corebox"/>
<text x="366" y="122" class="bold small" text-anchor="start">ports</text>
<text x="366" y="135" class="small" text-anchor="start">name, role in/out, dtype, shape</text>
<text x="366" y="154" class="bold small" text-anchor="start">swap class</text>
<text x="366" y="167" class="small" text-anchor="start">exact | approximate | model changing | observer</text>
<text x="366" y="186" class="bold small" text-anchor="start">metrics + tolerances</text>
<text x="366" y="199" class="small" text-anchor="start">what a run reports, and what may differ</text>
<text x="366" y="218" class="bold small" text-anchor="start">float64 reference</text>
<text x="366" y="231" class="small" text-anchor="start">shipped with the stage, or the implementation's own</text>
<text x="366" y="250" class="bold small" text-anchor="start">judge</text>
<text x="366" y="263" class="small" text-anchor="start">how a run of the stage is measured</text>
<text x="366" y="282" class="bold small" text-anchor="start">extensions</text>
<text x="366" y="295" class="small" text-anchor="start">optional facts, such as a matrix's sparsity</text>
<path d="M366,308 L634,308" class="rule"/>
<text x="366" y="324" class="bold small" text-anchor="start">six stages today</text>
<text x="366" y="340" class="small mono" text-anchor="start">newton.linear_solve</text>
<text x="506" y="340" class="tag" text-anchor="start">exact</text>
<text x="366" y="354" class="small mono" text-anchor="start">effective.solve</text>
<text x="506" y="354" class="tag" text-anchor="start">exact*</text>
<text x="366" y="368" class="small mono" text-anchor="start">dof.passive_force</text>
<text x="506" y="368" class="tag" text-anchor="start">model changing</text>
<text x="366" y="382" class="small mono" text-anchor="start">control.law</text>
<text x="506" y="382" class="tag" text-anchor="start">model changing</text>
<text x="366" y="396" class="small mono" text-anchor="start">body.wrench</text>
<text x="506" y="396" class="tag" text-anchor="start">model changing</text>
<text x="366" y="410" class="small mono" text-anchor="start">probe.state</text>
<text x="506" y="410" class="tag" text-anchor="start">observer</text>
<text x="366" y="432" class="tag" text-anchor="start">* a typed solver step may declare itself approximate</text>
<text x="366" y="445" class="tag" text-anchor="start">A host offers the stages it has: a chain has no bodies,</text>
<text x="366" y="458" class="tag" text-anchor="start">so no body.wrench</text>
<rect x="704" y="100.0" width="272" height="61.333333333333336" rx="3" class="hostbox"/>
<text x="713" y="118.0" class="head" text-anchor="start">MuJoCo Warp</text>
<text x="713" y="135.0" class="small" text-anchor="start">GPU, Warp arrays, CUDA graph</text>
<text x="713" y="149.0" class="small" text-anchor="start">the worked example</text>
<rect x="704" y="169.33333333333334" width="272" height="61.333333333333336" rx="3" class="hostbox"/>
<text x="713" y="187.33333333333334" class="head" text-anchor="start">MJLab</text>
<text x="713" y="204.33333333333334" class="small" text-anchor="start">wraps MuJoCo Warp's data;</text>
<text x="713" y="218.33333333333334" class="small" text-anchor="start">tested against a stand-in</text>
<rect x="704" y="238.66666666666669" width="272" height="61.333333333333336" rx="3" class="hostbox"/>
<text x="713" y="256.6666666666667" class="head" text-anchor="start">spring-mass chain, NumPy</text>
<text x="713" y="273.6666666666667" class="small" text-anchor="start">CPU; no MuJoCo, no GPU</text>
<text x="713" y="287.6666666666667" class="small" text-anchor="start">its own names: x, v, a</text>
<rect x="704" y="308.0" width="272" height="61.333333333333336" rx="3" class="hostbox"/>
<text x="713" y="326.0" class="head" text-anchor="start">spring-mass chain, JAX</text>
<text x="713" y="343.0" class="small" text-anchor="start">arrays that cannot be written in</text>
<text x="713" y="357.0" class="small" text-anchor="start">place; the step compiles (XLA)</text>
<rect x="704" y="377.33333333333337" width="272" height="61.333333333333336" rx="3" class="hostbox"/>
<text x="713" y="395.33333333333337" class="head" text-anchor="start">fake host</text>
<text x="713" y="412.33333333333337" class="small" text-anchor="start">no simulator: faulty runtimes</text>
<text x="713" y="426.33333333333337" class="small" text-anchor="start">to test the check itself</text>
<rect x="704" y="446.66666666666674" width="272" height="61.333333333333336" rx="3" class="yours"/>
<text x="713" y="464.66666666666674" class="head" text-anchor="start">your simulator</text>
<text x="713" y="481.66666666666674" class="small" text-anchor="start">a Host: facts(), stages(), meter()</text>
<text x="713" y="495.66666666666674" class="small" text-anchor="start">and a table per stage</text>
<path d="M298,136.0 L353,136.0" class="aarrow"/>
<path d="M298,220.0 L353,220.0" class="aarrow"/>
<path d="M298,304.0 L353,304.0" class="aarrow"/>
<path d="M298,388.0 L353,388.0" class="aarrow"/>
<path d="M298,472.0 L353,472.0" class="aarrow"/>
<path d="M702,130.66666666666666 L647,130.66666666666666" class="aarrow"/>
<path d="M702,200.0 L647,200.0" class="aarrow"/>
<path d="M702,269.33333333333337 L647,269.33333333333337" class="aarrow"/>
<path d="M702,338.6666666666667 L647,338.6666666666667" class="aarrow"/>
<path d="M702,408.00000000000006 L647,408.00000000000006" class="aarrow"/>
<path d="M702,477.3333333333334 L647,477.3333333333334" class="aarrow"/>
<rect x="24" y="536" width="16" height="16" rx="2" class="badge"/>
<text x="32" y="548" class="badgetx">1</text>
<text x="48" y="548" class="head" text-anchor="start">Install</text>
<text x="109.0" y="548" class="sub" text-anchor="start">a session puts an implementation behind a stage for the length of a with-block</text>
<rect x="24" y="562" width="172" height="56" rx="3" class="corebox"/>
<text x="33" y="580" class="bold mono" text-anchor="start">select</text>
<text x="33" y="597" class="small" text-anchor="start">Selection(stage, impl, params)</text>
<path d="M198,590 L220,590" class="aarrow"/>
<rect x="223" y="562" width="172" height="56" rx="3" class="corebox"/>
<text x="232" y="580" class="bold mono" text-anchor="start">guard</text>
<text x="232" y="597" class="small" text-anchor="start">the hooked function's source</text>
<text x="232" y="611" class="small" text-anchor="start">must be one that was reviewed</text>
<path d="M397,590 L419,590" class="aarrow"/>
<rect x="422" y="562" width="172" height="56" rx="3" class="corebox"/>
<text x="431" y="580" class="bold mono" text-anchor="start">install</text>
<text x="431" y="597" class="small" text-anchor="start">one scoped patch; none</text>
<text x="431" y="611" class="small" text-anchor="start">nested; one process lock</text>
<path d="M596,590 L618,590" class="aarrow"/>
<rect x="621" y="562" width="172" height="56" rx="3" class="corebox"/>
<text x="630" y="580" class="bold mono" text-anchor="start">run</text>
<text x="630" y="597" class="small" text-anchor="start">the host steps; its meter</text>
<text x="630" y="611" class="small" text-anchor="start">counts calls on the device</text>
<path d="M795,590 L817,590" class="aarrow"/>
<rect x="820" y="562" width="172" height="56" rx="3" class="corebox"/>
<text x="829" y="580" class="bold mono" text-anchor="start">restore</text>
<text x="829" y="597" class="small" text-anchor="start">on every way out,</text>
<text x="829" y="611" class="small" text-anchor="start">including an exception</text>
<rect x="24" y="638" width="16" height="16" rx="2" class="badge"/>
<text x="32" y="650" class="badgetx">2</text>
<text x="48" y="650" class="head" text-anchor="start">Check</text>
<text x="95.0" y="650" class="sub" text-anchor="start">the same check gates a submission, a graph run and a leaderboard entry</text>
<rect x="24" y="664" width="226" height="56" rx="3" class="corebox"/>
<text x="33" y="682" class="bold mono" text-anchor="start">drive the host</text>
<text x="33" y="699" class="small" text-anchor="start">a real step on a scene,</text>
<text x="33" y="713" class="small" text-anchor="start">each runtime call recorded</text>
<path d="M252,692 L269,692" class="aarrow"/>
<rect x="272" y="664" width="226" height="56" rx="3" class="corebox"/>
<text x="281" y="682" class="bold mono" text-anchor="start">what it did</text>
<text x="281" y="699" class="small" text-anchor="start">inputs it was handed, outputs it</text>
<text x="281" y="713" class="small" text-anchor="start">wrote, as the device saw them</text>
<path d="M500,692 L517,692" class="aarrow"/>
<rect x="520" y="664" width="226" height="56" rx="3" class="corebox"/>
<text x="529" y="682" class="bold mono" text-anchor="start">float64 reference</text>
<text x="529" y="699" class="small" text-anchor="start">same inputs, in NumPy: the stage's</text>
<text x="529" y="713" class="small" text-anchor="start">reference or the implementation's</text>
<path d="M748,692 L765,692" class="aarrow"/>
<rect x="768" y="664" width="226" height="56" rx="3" class="corebox"/>
<text x="777" y="682" class="bold mono" text-anchor="start">judge by class</text>
<text x="777" y="699" class="small" text-anchor="start">metrics within the contract's</text>
<text x="777" y="713" class="small" text-anchor="start">tolerances; inputs left alone</text>
<path d="M24,738 L976,738" class="rule"/>
<text x="24" y="758" class="small" text-anchor="start">built on it, as separate packages:</text>
<text x="24" y="774" class="small" text-anchor="start">phost-lab times a graph in an isolated worker; phost-score gates and ranks; phost-dash is the browser view; phost-agent lets models search.</text>
</svg>
