<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-labelledby="ttl dsc">
<title id="ttl">phost: stage contracts between a simulator and the implementations that replace its parts</title>
<desc id="dsc">Left: implementations (typed equations and sandboxed kernels from phost-author, the coupled-block Cholesky, built-in laws, your own) are written against a stage contract. Middle: the contract (ports, swap class, metrics and tolerances, a float64 reference, a judge) and the six stages that exist. Right: host adapters map a simulator's own function onto the contract: MuJoCo Warp, MJLab, a NumPy chain, a JAX chain, a fake host, or yours. Below: a session installs an implementation for a with-block behind a source guard, and check_impl judges it against the float64 reference. Lab, score, dash and agent build on that.</desc>
<style>
  :root { --bg:#ffffff; --ink:#1b1b1a; --ink2:#4a4945; --muted:#66645f; --line:#8c8a84; --rule:#d6d5cf;
          --host:#efeeea; --accent:#1f5fbf; --accentfill:#e8f0fb; --onaccent:#ffffff; --warn:#8a4b00; }
  @media (prefers-color-scheme: dark) {
