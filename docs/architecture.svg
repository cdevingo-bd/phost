<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" width="1000" height="852" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Where phost attaches to MuJoCo Warp's step, and how an implementation is checked</title>
<desc id="dsc">Panel 1: the MuJoCo Warp step as six functions with six numbered splice points, and a table of what each splice reads and writes. Panel 2: one splice: derive the contract's ports from the host's device arrays, call the implementation, write back, with a source-hash guard and a scoped install. Panel 3: the contract check against a float64 reference, and the lab, score and dashboard that time, judge and show a graph.</desc>
