<text x="505" y="663" class="small" text-anchor="start">same inputs, in NumPy; shipped</text>
<text x="505" y="676" class="small" text-anchor="start">with the stage or the impl's own</text>
<rect x="708" y="630" width="268" height="52" class="phostbox"/>
<text x="717" y="648" class="mono bold small" text-anchor="start">judge, then gate</text>
<text x="717" y="663" class="small" text-anchor="start">metrics (residual, law error, effect</text>
<text x="717" y="676" class="small" text-anchor="start">error) within the contract's tolerances</text>
